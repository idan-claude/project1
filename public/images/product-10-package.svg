<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" shape-rendering="geometricPrecision">
  <defs>
    <pattern id="pb" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#1C1E22"/>
      <circle cx="2" cy="2" r="1.5" fill="#252829"/>
      <circle cx="6.5" cy="6.5" r="1.5" fill="#252829"/>
      <circle cx="2" cy="7" r="1.1" fill="#232628"/>
      <circle cx="7" cy="2" r="1.1" fill="#232628"/>
    </pattern>
    <linearGradient id="bxg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282830"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
  </defs>

  <rect width="900" height="900" fill="#F0EEE9"/>
  <ellipse cx="450" cy="430" rx="380" ry="250" fill="white" opacity="0.50"/>

  <!-- Box shadow -->
  <rect x="268" y="220" width="364" height="222" rx="14" fill="#000" opacity="0.07" transform="translate(6,16)"/>

  <!-- Box body -->
  <rect x="268" y="220" width="364" height="222" rx="12" fill="url(#bxg)"/>
  <rect x="280" y="232" width="340" height="198" rx="8" fill="#222228"/>

  <!-- Box top flap (open) -->
  <path d="M268,220 L268,140 L632,140 L632,220 Z" fill="#1E1E26" opacity="0.86"/>
  <rect x="268" y="138" width="364" height="4" rx="2" fill="#303038"/>

  <!-- Edge highlights on box -->
  <rect x="268" y="220" width="364" height="2" fill="white" opacity="0.04"/>

  <!-- FindCard in box -->
  <g transform="translate(450, 342) rotate(-2)">
    <rect x="-130" y="-82" width="260" height="164" rx="14" fill="#000" opacity="0.20" transform="translate(3,5)"/>
    <rect x="-130" y="-82" width="260" height="164" rx="14" fill="#1C1E22"/>
    <rect x="-130" y="-82" width="260" height="164" rx="14" fill="url(#pb)" opacity="0.92"/>
    <rect x="-130" y="-82" width="260" height="2" fill="white" opacity="0.05"/>
    <g transform="translate(-36, 10)" fill="none" stroke="#282B2E" stroke-linecap="round">
      <path d="M -7,0 A 8,8 0 0 0 7,0" stroke-width="2.2"/>
      <path d="M -11,3 A 12,12 0 0 0 11,3" stroke-width="1.9"/>
      <path d="M -16,6 A 17,17 0 0 0 16,6" stroke-width="1.7"/>
      <path d="M 2,9 L -3,18 L 1,18 L -3,28" stroke-width="1.9"/>
    </g>
    <rect x="122" y="-41" width="9" height="16" rx="2.5" fill="#0F1114"/>
  </g>

  <!-- Wireless charging pad (left) -->
  <g transform="translate(268, 512)">
    <ellipse cx="0" cy="10" rx="58" ry="12" fill="#000" opacity="0.06"/>
    <circle cx="0" cy="0" r="52" fill="#1E1E28" stroke="#2C2C38" stroke-width="2"/>
    <circle cx="0" cy="0" r="38" fill="#181820" stroke="#262632" stroke-width="1.5"/>
    <!-- Qi arcs (visual only) -->
    <g fill="none" stroke="#3A50CC" stroke-width="2.2" opacity="0.58">
      <path d="M -11,-8 A 13,13 0 1,1 11,-8" stroke-linecap="round"/>
      <path d="M -7,-4 A 8,8 0 1,1 7,-4" stroke-linecap="round"/>
      <circle cx="0" cy="4" r="3" fill="#3A50CC"/>
    </g>
    <circle cx="28" cy="-24" r="4" fill="#4488FF" opacity="0.82"/>
  </g>

  <!-- Quick start guide (right, no text — just visual bars) -->
  <g transform="translate(618, 512)">
    <rect x="-52" y="-70" width="104" height="140" rx="6" fill="#000" opacity="0.06" transform="translate(3,6)"/>
    <rect x="-52" y="-70" width="104" height="140" rx="6" fill="white" stroke="#DDE0E8" stroke-width="1.5"/>
    <!-- Dark header bar -->
    <rect x="-52" y="-70" width="104" height="26" rx="6" fill="#1C1E22"/>
    <rect x="-52" y="-44" width="104" height="4" rx="0" fill="#1C1E22"/>
    <!-- Content lines (no text) -->
    <rect x="-38" y="-32" width="68" height="7" rx="3.5" fill="#D0D4DC" opacity="0.75"/>
    <rect x="-38" y="-18" width="54" height="7" rx="3.5" fill="#D0D4DC" opacity="0.60"/>
    <rect x="-38" y="-4" width="62" height="7" rx="3.5" fill="#D0D4DC" opacity="0.50"/>
    <rect x="-38" y="10" width="38" height="7" rx="3.5" fill="#8BC4A0" opacity="0.65"/>
    <!-- QR placeholder -->
    <rect x="-28" y="24" width="56" height="56" rx="4" fill="#F2F4F8" stroke="#C8CCD4" stroke-width="1"/>
    <rect x="-24" y="28" width="16" height="16" rx="1.5" fill="#484C56" opacity="0.48"/>
    <rect x="8" y="28" width="16" height="16" rx="1.5" fill="#484C56" opacity="0.48"/>
    <rect x="-24" y="60" width="16" height="16" rx="1.5" fill="#484C56" opacity="0.48"/>
    <rect x="-4" y="40" width="10" height="10" rx="1.5" fill="#484C56" opacity="0.32"/>
  </g>
</svg>
