<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <!-- Background: clean white -->
  <rect width="900" height="900" fill="#F8F8FA"/>
  <ellipse cx="450" cy="400" rx="360" ry="240" fill="white" opacity="0.60"/>

  <!-- BOX (open, elegant) -->
  <g transform="translate(450, 300)">
    <!-- Box shadow -->
    <rect x="-180" y="-80" width="360" height="220" rx="12" fill="#000" opacity="0.07" transform="translate(0,15)"/>
    <!-- Box body -->
    <rect x="-180" y="-80" width="360" height="220" rx="12" fill="#1A1A1C"/>
    <!-- Box inner (lighter) -->
    <rect x="-168" y="-68" width="336" height="196" rx="8" fill="#222226"/>
    <!-- Box top flap (open, folded back) -->
    <path d="M-180,-80 L-180,-160 L180,-160 L180,-80 Z" fill="#1A1A1C" opacity="0.85"/>
    <rect x="-180" y="-162" width="360" height="4" rx="2" fill="#2A2A2E"/>
    <!-- Box edge highlight -->
    <rect x="-180" y="-80" width="360" height="2" rx="1" fill="white" opacity="0.05"/>
    <!-- "FindCard PRO" box label -->
    <text x="0" y="-115" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle" opacity="0.60" letter-spacing="2">FINDCARD PRO</text>
    <!-- Small star/logo on box flap -->
    <circle cx="0" cy="-135" r="18" fill="none" stroke="white" stroke-width="1.5" opacity="0.25"/>
    <text x="0" y="-130" font-family="Arial" font-size="15" text-anchor="middle" fill="white" opacity="0.35">✦</text>
  </g>

  <!-- ITEM 1: FindCard card (main, in box) -->
  <g transform="translate(450 345) rotate(-3)">
    <!-- Card shadow -->
    <rect x="-130" y="-42" width="260" height="84" rx="10" fill="#000" opacity="0.20" transform="translate(3,5)"/>
    <!-- Matte black card -->
    <rect x="-130" y="-42" width="260" height="84" rx="10" fill="#1A1A1C"/>
    <!-- Texture dots -->
    <g fill="#2C2C2E" opacity="0.50">
      <circle cx="-112" cy="-28" r="1"/><circle cx="-94" cy="-28" r="1"/><circle cx="-76" cy="-28" r="1"/><circle cx="-58" cy="-28" r="1"/><circle cx="-40" cy="-28" r="1"/><circle cx="-22" cy="-28" r="1"/><circle cx="-4" cy="-28" r="1"/><circle cx="14" cy="-28" r="1"/><circle cx="32" cy="-28" r="1"/><circle cx="50" cy="-28" r="1"/><circle cx="68" cy="-28" r="1"/><circle cx="86" cy="-28" r="1"/><circle cx="104" cy="-28" r="1"/>
      <circle cx="-120" cy="-12" r="1"/><circle cx="-102" cy="-12" r="1"/><circle cx="-84" cy="-12" r="1"/><circle cx="-66" cy="-12" r="1"/><circle cx="-48" cy="-12" r="1"/><circle cx="-30" cy="-12" r="1"/><circle cx="-12" cy="-12" r="1"/><circle cx="6" cy="-12" r="1"/><circle cx="24" cy="-12" r="1"/><circle cx="42" cy="-12" r="1"/><circle cx="60" cy="-12" r="1"/><circle cx="78" cy="-12" r="1"/><circle cx="96" cy="-12" r="1"/><circle cx="114" cy="-12" r="1"/>
    </g>
    <!-- Top edge highlight -->
    <rect x="-130" y="-42" width="260" height="1.5" rx="0.75" fill="white" opacity="0.06"/>
    <!-- Wireless coil small -->
    <g transform="translate(95, 18)" fill="none" stroke="white" opacity="0.25">
      <circle cx="0" cy="0" r="12" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="7" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" stroke-width="1"/>
    </g>
    <!-- Text mark -->
    <text x="-118" y="32" font-family="Arial, sans-serif" font-size="7" font-weight="600" fill="white" opacity="0.18" letter-spacing="1.2">FINDCARD PRO</text>
  </g>

  <!-- Number label for card -->
  <circle cx="244" cy="345" r="16" fill="#1A1A1C"/>
  <text x="244" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">1</text>

  <!-- ITEM 2: Wireless charging pad -->
  <g transform="translate(270, 490)">
    <!-- Pad shadow -->
    <ellipse cx="0" cy="10" rx="60" ry="12" fill="#000" opacity="0.08"/>
    <!-- Charging pad body -->
    <circle cx="0" cy="0" r="52" fill="#222228" stroke="#2E2E36" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="#1A1A20" stroke="#28282E" stroke-width="1.5"/>
    <!-- Qi symbol -->
    <g fill="none" stroke="#4466CC" stroke-width="2.5" opacity="0.65">
      <path d="M-12,-8 A15,15 0 1,1 12,-8" stroke-linecap="round"/>
      <path d="M-7,-3 A9,9 0 1,1 7,-3" stroke-linecap="round"/>
      <circle cx="0" cy="5" r="3" fill="#4466CC"/>
    </g>
    <!-- LED dot -->
    <circle cx="30" cy="-25" r="4" fill="#4488FF" opacity="0.85"/>
  </g>

  <!-- Number label for charger -->
  <circle cx="244" cy="490" r="16" fill="#4466CC"/>
  <text x="244" y="495" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">2</text>

  <!-- ITEM 3: Quick start guide (small folded card) -->
  <g transform="translate(620, 490)">
    <!-- Guide shadow -->
    <rect x="-52" y="-68" width="104" height="136" rx="6" fill="#000" opacity="0.07" transform="translate(3,6)"/>
    <!-- Guide card -->
    <rect x="-52" y="-68" width="104" height="136" rx="6" fill="white" stroke="#E0E4EC" stroke-width="1.5"/>
    <!-- Guide header stripe -->
    <rect x="-52" y="-68" width="104" height="28" rx="6" fill="#1A1A1C"/>
    <text x="0" y="-50" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="white" text-anchor="middle" opacity="0.75">מדריך הגדרה</text>
    <!-- Guide steps -->
    <text x="-38" y="-24" font-family="Arial, sans-serif" font-size="8" fill="#444" opacity="0.8">1. פתח Find My</text>
    <text x="-38" y="-8" font-family="Arial, sans-serif" font-size="8" fill="#444" opacity="0.8">2. לחץ "הוסף מכשיר"</text>
    <text x="-38" y="8" font-family="Arial, sans-serif" font-size="8" fill="#444" opacity="0.8">3. עקוב אחר ההוראות</text>
    <text x="-38" y="24" font-family="Arial, sans-serif" font-size="8" fill="#32AE60" opacity="0.9" font-weight="600">✓ מוכן תוך 30 שניות!</text>
    <!-- QR code placeholder -->
    <rect x="-25" y="40" width="50" height="50" rx="4" fill="#F0F0F8" stroke="#CCC" stroke-width="1"/>
    <g fill="#444" opacity="0.5">
      <rect x="-22" y="43" width="14" height="14" rx="1"/>
      <rect x="8" y="43" width="14" height="14" rx="1"/>
      <rect x="-22" y="73" width="14" height="14" rx="1"/>
      <rect x="-4" y="55" width="8" height="8" rx="1"/>
    </g>
  </g>

  <!-- Number label for guide -->
  <circle cx="656" cy="490" r="16" fill="#32AE60"/>
  <text x="656" y="495" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">3</text>

  <!-- Item labels at bottom -->
  <text x="270" y="570" font-family="Arial, sans-serif" font-size="13" fill="#3A3A4A" text-anchor="middle" font-weight="600">מטען אלחוטי Qi</text>
  <text x="620" y="570" font-family="Arial, sans-serif" font-size="13" fill="#3A3A4A" text-anchor="middle" font-weight="600">מדריך הגדרה</text>
  <text x="450" y="390" font-family="Arial, sans-serif" font-size="13" fill="#3A3A4A" text-anchor="middle" font-weight="700">FindCard PRO</text>

  <!-- "What's in the box" header -->
  <rect x="305" y="160" width="290" height="42" rx="21" fill="#F0F2F8" stroke="#D8DCE8" stroke-width="1.5"/>
  <text x="450" y="186" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2A2A4A" text-anchor="middle">📦 מה בקופסה?</text>

  <!-- Caption -->
  <text x="450" y="800" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1A2E" text-anchor="middle" opacity="0.88">הכל כלול — מוכן להגדרה מיידית</text>
  <text x="450" y="824" font-family="Arial, sans-serif" font-size="13" fill="#888" text-anchor="middle">FindCard PRO + מטען אלחוטי + מדריך הגדרה</text>
</svg>
