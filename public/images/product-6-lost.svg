<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" shape-rendering="geometricPrecision">
  <defs>
    <pattern id="pb" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#1C1E22"/>
      <circle cx="2" cy="2" r="1.5" fill="#252829"/>
      <circle cx="6.5" cy="6.5" r="1.5" fill="#252829"/>
      <circle cx="2" cy="7" r="1.1" fill="#232628"/>
      <circle cx="7" cy="2" r="1.1" fill="#232628"/>
    </pattern>
  </defs>

  <rect width="900" height="900" fill="#F0EDE8"/>
  <ellipse cx="450" cy="460" rx="340" ry="230" fill="white" opacity="0.36"/>

  <!-- Searching person silhouette (subtle) -->
  <g opacity="0.16" fill="#8A6030">
    <circle cx="350" cy="210" r="38"/>
    <rect x="320" y="248" width="60" height="84" rx="14"/>
    <rect x="228" y="256" width="96" height="20" rx="10" transform="rotate(-22, 276, 260)"/>
    <rect x="382" y="256" width="80" height="20" rx="10" transform="rotate(12, 432, 261)"/>
    <rect x="320" y="326" width="26" height="72" rx="12"/>
    <rect x="354" y="326" width="26" height="72" rx="12"/>
  </g>

  <!-- Wallet silhouette -->
  <g transform="translate(330, 498)">
    <rect x="-110" y="-70" width="220" height="140" rx="14" fill="#6B4226" opacity="0.65"/>
    <rect x="-110" y="-70" width="220" height="90" rx="14" fill="#8A5A30" opacity="0.55"/>
    <rect x="-100" y="-72" width="200" height="8" rx="4" fill="#4A2E14" opacity="0.45"/>
    <!-- Clasp -->
    <circle cx="55" cy="42" r="10" fill="#A07832" opacity="0.65"/>
    <circle cx="55" cy="42" r="6" fill="#7A5824" opacity="0.65"/>
  </g>

  <!-- Location pin above wallet -->
  <g transform="translate(330, 398)">
    <ellipse cx="1" cy="30" rx="10" ry="4" fill="#000" opacity="0.16"/>
    <path d="M0,-28 C-14,-28 -24,-18 -24,-6 C-24,10 0,32 0,32 C0,32 24,10 24,-6 C24,-18 14,-28 0,-28 Z" fill="#FF3B30"/>
    <circle cx="0" cy="-6" r="10" fill="white"/>
    <rect x="-5" y="-10" width="10" height="7" rx="1.5" fill="#1C1E22"/>
  </g>

  <!-- Phone with Found notification (no text) -->
  <g transform="translate(582, 392)">
    <rect x="-65" y="-95" width="130" height="190" rx="20" fill="#000" opacity="0.10" transform="translate(4,6)"/>
    <rect x="-65" y="-95" width="130" height="190" rx="20" fill="#1C1C1E"/>
    <rect x="-57" y="-85" width="114" height="170" rx="14" fill="#1A1A1A"/>
    <!-- Green success notification card -->
    <rect x="-52" y="-78" width="104" height="74" rx="12" fill="white" opacity="0.96"/>
    <!-- Find My green circle with checkmark path -->
    <circle cx="-28" cy="-50" r="16" fill="#32AE60"/>
    <path d="M -36,-50 L -30,-44 L -20,-58" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Notification content bars -->
    <rect x="-6" y="-62" width="46" height="7" rx="3.5" fill="#D8DCE4" opacity="0.8"/>
    <rect x="-6" y="-50" width="38" height="6" rx="3" fill="#C8CCD4" opacity="0.65"/>
    <rect x="-6" y="-38" width="30" height="5" rx="2.5" fill="#C8CCD4" opacity="0.5"/>
    <!-- Home bar -->
    <rect x="-18" y="68" width="36" height="4" rx="2" fill="white" opacity="0.30"/>
  </g>

  <!-- Signal dashed line from wallet to phone -->
  <path d="M330,428 Q460,350 528,340" stroke="#32AE60" stroke-width="2" fill="none" stroke-dasharray="6 5" opacity="0.42"/>
</svg>
