<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <!-- Background: clean light gray -->
  <rect width="900" height="900" fill="#F4F4F6"/>
  <ellipse cx="450" cy="430" rx="340" ry="220" fill="white" opacity="0.6"/>

  <!-- Card shadow -->
  <rect x="168" y="330" width="564" height="358" rx="28" fill="#000000" opacity="0.08" transform="translate(0,20)"/>
  <rect x="168" y="330" width="564" height="358" rx="28" fill="#000000" opacity="0.05" transform="translate(0,10)"/>

  <!-- Card group (slight tilt -5°) -->
  <g transform="translate(450 460) rotate(-5)">
    <!-- Matte black card body - flat, no metallic gradient -->
    <rect x="-282" y="-179" width="564" height="358" rx="26" fill="#1A1A1C"/>

    <!-- Subtle matte texture dots grid -->
    <g fill="#2C2C2E" opacity="0.55">
      <circle cx="-250" cy="-150" r="1.2"/><circle cx="-225" cy="-150" r="1.2"/><circle cx="-200" cy="-150" r="1.2"/><circle cx="-175" cy="-150" r="1.2"/><circle cx="-150" cy="-150" r="1.2"/><circle cx="-125" cy="-150" r="1.2"/><circle cx="-100" cy="-150" r="1.2"/><circle cx="-75" cy="-150" r="1.2"/><circle cx="-50" cy="-150" r="1.2"/><circle cx="-25" cy="-150" r="1.2"/><circle cx="0" cy="-150" r="1.2"/><circle cx="25" cy="-150" r="1.2"/><circle cx="50" cy="-150" r="1.2"/><circle cx="75" cy="-150" r="1.2"/><circle cx="100" cy="-150" r="1.2"/><circle cx="125" cy="-150" r="1.2"/><circle cx="150" cy="-150" r="1.2"/><circle cx="175" cy="-150" r="1.2"/><circle cx="200" cy="-150" r="1.2"/><circle cx="225" cy="-150" r="1.2"/><circle cx="250" cy="-150" r="1.2"/>
      <circle cx="-262" cy="-125" r="1.2"/><circle cx="-237" cy="-125" r="1.2"/><circle cx="-212" cy="-125" r="1.2"/><circle cx="-187" cy="-125" r="1.2"/><circle cx="-162" cy="-125" r="1.2"/><circle cx="-137" cy="-125" r="1.2"/><circle cx="-112" cy="-125" r="1.2"/><circle cx="-87" cy="-125" r="1.2"/><circle cx="-62" cy="-125" r="1.2"/><circle cx="-37" cy="-125" r="1.2"/><circle cx="-12" cy="-125" r="1.2"/><circle cx="13" cy="-125" r="1.2"/><circle cx="38" cy="-125" r="1.2"/><circle cx="63" cy="-125" r="1.2"/><circle cx="88" cy="-125" r="1.2"/><circle cx="113" cy="-125" r="1.2"/><circle cx="138" cy="-125" r="1.2"/><circle cx="163" cy="-125" r="1.2"/><circle cx="188" cy="-125" r="1.2"/><circle cx="213" cy="-125" r="1.2"/><circle cx="238" cy="-125" r="1.2"/>
      <circle cx="-250" cy="-100" r="1.2"/><circle cx="-225" cy="-100" r="1.2"/><circle cx="-200" cy="-100" r="1.2"/><circle cx="-175" cy="-100" r="1.2"/><circle cx="-150" cy="-100" r="1.2"/><circle cx="-125" cy="-100" r="1.2"/><circle cx="-100" cy="-100" r="1.2"/><circle cx="-75" cy="-100" r="1.2"/><circle cx="-50" cy="-100" r="1.2"/><circle cx="-25" cy="-100" r="1.2"/><circle cx="0" cy="-100" r="1.2"/><circle cx="25" cy="-100" r="1.2"/><circle cx="50" cy="-100" r="1.2"/><circle cx="75" cy="-100" r="1.2"/><circle cx="100" cy="-100" r="1.2"/><circle cx="125" cy="-100" r="1.2"/><circle cx="150" cy="-100" r="1.2"/><circle cx="175" cy="-100" r="1.2"/><circle cx="200" cy="-100" r="1.2"/><circle cx="225" cy="-100" r="1.2"/><circle cx="250" cy="-100" r="1.2"/>
      <circle cx="-262" cy="-75" r="1.2"/><circle cx="-237" cy="-75" r="1.2"/><circle cx="-212" cy="-75" r="1.2"/><circle cx="-187" cy="-75" r="1.2"/><circle cx="-162" cy="-75" r="1.2"/><circle cx="-137" cy="-75" r="1.2"/><circle cx="-112" cy="-75" r="1.2"/><circle cx="-87" cy="-75" r="1.2"/><circle cx="-62" cy="-75" r="1.2"/><circle cx="-37" cy="-75" r="1.2"/><circle cx="-12" cy="-75" r="1.2"/><circle cx="13" cy="-75" r="1.2"/><circle cx="38" cy="-75" r="1.2"/><circle cx="63" cy="-75" r="1.2"/><circle cx="88" cy="-75" r="1.2"/><circle cx="113" cy="-75" r="1.2"/><circle cx="138" cy="-75" r="1.2"/><circle cx="163" cy="-75" r="1.2"/><circle cx="188" cy="-75" r="1.2"/><circle cx="213" cy="-75" r="1.2"/><circle cx="238" cy="-75" r="1.2"/>
    </g>

    <!-- Very subtle top edge highlight (matte sheen, not metallic) -->
    <rect x="-282" y="-179" width="564" height="3" rx="2" fill="white" opacity="0.07"/>
    <!-- Left edge subtle highlight -->
    <rect x="-282" y="-179" width="3" height="358" rx="1.5" fill="white" opacity="0.04"/>

    <!-- Small wireless charging coil indicator (bottom right corner) -->
    <g transform="translate(210, 120)" fill="none" stroke="white" stroke-linecap="round" opacity="0.30">
      <circle cx="0" cy="0" r="22" stroke-width="2"/>
      <circle cx="0" cy="0" r="14" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2" fill="white" stroke="none" opacity="0.6"/>
    </g>

    <!-- FindCard text mark (subtle, low contrast) -->
    <text x="-230" y="148" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="white" opacity="0.22" letter-spacing="2">FINDCARD PRO</text>
  </g>

  <!-- Caption -->
  <text x="450" y="778" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1A2E" text-anchor="middle" opacity="0.88">כרטיס מעקב · Apple Find My</text>
  <text x="450" y="803" font-family="Arial, sans-serif" font-size="13" fill="#888" text-anchor="middle">גימור מאט · עובי 1.8 מ״מ · IP67 עמיד מים</text>
</svg>
