<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" shape-rendering="geometricPrecision">
  <defs>
    <pattern id="pb" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#1C1E22"/>
      <circle cx="2" cy="2" r="1.5" fill="#252829"/>
      <circle cx="6.5" cy="6.5" r="1.5" fill="#252829"/>
      <circle cx="2" cy="7" r="1.1" fill="#232628"/>
      <circle cx="7" cy="2" r="1.1" fill="#232628"/>
    </pattern>
  </defs>

  <rect width="900" height="900" fill="#EDEEF2"/>
  <ellipse cx="450" cy="420" rx="320" ry="220" fill="white" opacity="0.4"/>

  <!-- iPhone -->
  <g transform="translate(450, 420)">
    <!-- Shadow -->
    <rect x="-120" y="-236" width="240" height="472" rx="36" fill="#000" opacity="0.12" transform="translate(4,8)"/>
    <!-- Body -->
    <rect x="-120" y="-236" width="240" height="472" rx="36" fill="#1C1C1E"/>
    <!-- Side buttons -->
    <rect x="120" y="-124" width="6" height="50" rx="3" fill="#2A2A2C"/>
    <rect x="120" y="-52" width="6" height="34" rx="3" fill="#2A2A2C"/>
    <rect x="-126" y="-82" width="6" height="62" rx="3" fill="#2A2A2C"/>
    <!-- Screen bezel -->
    <rect x="-110" y="-222" width="220" height="444" rx="28" fill="#0C0C10"/>
    <!-- Map background -->
    <rect x="-106" y="-214" width="212" height="428" rx="22" fill="#1E5530"/>
    <!-- Map grid -->
    <line x1="-106" y1="-100" x2="106" y2="-100" stroke="#276638" stroke-width="2" opacity="0.6"/>
    <line x1="-106" y1="10" x2="106" y2="10" stroke="#276638" stroke-width="2" opacity="0.6"/>
    <line x1="-106" y1="120" x2="106" y2="120" stroke="#276638" stroke-width="2" opacity="0.6"/>
    <line x1="-50" y1="-214" x2="-50" y2="214" stroke="#276638" stroke-width="2" opacity="0.6"/>
    <line x1="30" y1="-214" x2="30" y2="214" stroke="#276638" stroke-width="2" opacity="0.6"/>
    <!-- Map blocks -->
    <rect x="-98" y="-205" width="36" height="24" rx="3" fill="#2A7040" opacity="0.72"/>
    <rect x="-52" y="-198" width="28" height="18" rx="2" fill="#2A7040" opacity="0.72"/>
    <rect x="-98" y="-162" width="22" height="32" rx="2" fill="#2A7040" opacity="0.72"/>
    <rect x="42" y="-185" width="44" height="26" rx="2" fill="#2A7040" opacity="0.72"/>
    <rect x="54" y="-140" width="36" height="22" rx="2" fill="#2A7040" opacity="0.72"/>
    <rect x="-82" y="30" width="30" height="40" rx="2" fill="#2A7040" opacity="0.72"/>
    <rect x="46" y="20" width="40" height="32" rx="2" fill="#2A7040" opacity="0.72"/>
    <!-- Accuracy circle -->
    <circle cx="-8" cy="-30" r="52" fill="#4488FF" opacity="0.10" stroke="#4488FF" stroke-width="1" stroke-dasharray="4 3" opacity="0.24"/>
    <!-- Location pin -->
    <g transform="translate(-8, -22)">
      <ellipse cx="1" cy="38" rx="11" ry="5" fill="#000" opacity="0.22"/>
      <path d="M0,-36 C-18,-36 -30,-22 -30,-8 C-30,14 0,40 0,40 C0,40 30,14 30,-8 C30,-22 18,-36 0,-36 Z" fill="#FF3B30"/>
      <circle cx="0" cy="-8" r="12" fill="white"/>
      <!-- Small card icon inside pin -->
      <rect x="-6" y="-12" width="12" height="8" rx="1.5" fill="#1C1E22"/>
    </g>
    <!-- Dynamic island -->
    <rect x="-28" y="-218" width="56" height="20" rx="10" fill="#1C1C1E"/>
  </g>
</svg>
