<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" shape-rendering="geometricPrecision">
  <defs>
    <pattern id="pb" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#1C1E22"/>
      <circle cx="2" cy="2" r="1.5" fill="#252829"/>
      <circle cx="6.5" cy="6.5" r="1.5" fill="#252829"/>
      <circle cx="2" cy="7" r="1.1" fill="#232628"/>
      <circle cx="7" cy="2" r="1.1" fill="#232628"/>
    </pattern>
    <pattern id="lth" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#7A5230"/>
      <circle cx="2" cy="2" r="1.4" fill="#6A4428" opacity="0.65"/>
      <circle cx="6" cy="6" r="1.4" fill="#6A4428" opacity="0.65"/>
      <circle cx="2" cy="6" r="1" fill="#5E3A22" opacity="0.45"/>
      <circle cx="6" cy="2" r="1" fill="#5E3A22" opacity="0.45"/>
    </pattern>
    <linearGradient id="wg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A6038"/>
      <stop offset="100%" stop-color="#4A2C12"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="#F2EDE5"/>
  <ellipse cx="450" cy="480" rx="330" ry="200" fill="white" opacity="0.32"/>

  <!-- Wallet shadow -->
  <rect x="188" y="382" width="524" height="334" rx="22" fill="#000" opacity="0.08" transform="translate(6,14)"/>

  <!-- Wallet body -->
  <rect x="188" y="382" width="524" height="334" rx="22" fill="url(#wg)"/>
  <rect x="188" y="382" width="524" height="334" rx="22" fill="url(#lth)" opacity="0.82"/>

  <!-- Stitching border -->
  <rect x="198" y="392" width="504" height="314" rx="18" fill="none" stroke="#C09050" stroke-width="1.5" stroke-dasharray="7 5" opacity="0.32"/>

  <!-- Card pocket opening -->
  <rect x="236" y="380" width="428" height="16" rx="8" fill="#3E2010" opacity="0.55"/>

  <!-- Snap button -->
  <circle cx="450" cy="695" r="12" fill="#B08040"/>
  <circle cx="450" cy="695" r="8" fill="#906020"/>
  <circle cx="450" cy="695" r="3.5" fill="#B08040"/>

  <!-- FindCard in wallet -->
  <g transform="translate(450, 424) rotate(0.5)" filter="url(#sh)">
    <rect x="-138" y="-87" width="276" height="174" rx="14" fill="#1C1E22"/>
    <rect x="-138" y="-87" width="276" height="174" rx="14" fill="url(#pb)" opacity="0.92"/>
    <rect x="-138" y="-87" width="276" height="2" fill="white" opacity="0.05"/>
    <g transform="translate(-39, 10)" fill="none" stroke="#282B2E" stroke-linecap="round">
      <path d="M -8,0 A 9,9 0 0 0 8,0" stroke-width="2.4"/>
      <path d="M -12,3 A 13,13 0 0 0 12,3" stroke-width="2.1"/>
      <path d="M -17,6 A 18,18 0 0 0 17,6" stroke-width="1.8"/>
      <path d="M 2,10 L -3,20 L 1,20 L -4,30" stroke-width="2.1"/>
    </g>
    <rect x="129" y="-38" width="9" height="16" rx="2.5" fill="#0F1114"/>
  </g>
</svg>
