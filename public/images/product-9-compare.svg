<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" shape-rendering="geometricPrecision">
  <defs>
    <pattern id="pb" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#1C1E22"/>
      <circle cx="2" cy="2" r="1.5" fill="#252829"/>
      <circle cx="6.5" cy="6.5" r="1.5" fill="#252829"/>
      <circle cx="2" cy="7" r="1.1" fill="#232628"/>
      <circle cx="7" cy="2" r="1.1" fill="#232628"/>
    </pattern>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CDD6E8"/>
      <stop offset="100%" stop-color="#A4B0C6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C840"/>
      <stop offset="100%" stop-color="#B09022"/>
    </linearGradient>
    <filter id="sh1" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="sh2" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="#F2F4F8"/>
  <ellipse cx="450" cy="430" rx="380" ry="240" fill="white" opacity="0.50"/>

  <!-- Generic credit card (left) -->
  <g transform="translate(232, 450)" filter="url(#sh1)">
    <rect x="-190" y="-120" width="380" height="240" rx="20" fill="url(#cg)"/>
    <rect x="-190" y="-120" width="380" height="50" rx="20" fill="white" opacity="0.20"/>
    <!-- EMV chip -->
    <rect x="-128" y="-58" width="50" height="40" rx="7" fill="url(#chip)"/>
    <line x1="-128" y1="-45" x2="-78" y2="-45" stroke="#7A5200" stroke-width="0.8" opacity="0.4"/>
    <line x1="-128" y1="-33" x2="-78" y2="-33" stroke="#7A5200" stroke-width="0.8" opacity="0.4"/>
    <line x1="-110" y1="-58" x2="-110" y2="-18" stroke="#7A5200" stroke-width="0.8" opacity="0.4"/>
    <line x1="-96" y1="-58" x2="-96" y2="-18" stroke="#7A5200" stroke-width="0.8" opacity="0.4"/>
    <!-- Contactless symbol -->
    <g transform="translate(118, -38)" fill="none" stroke="#6080A0" stroke-linecap="round" opacity="0.50">
      <path d="M -13,-13 A 18,18 0 0 1 13,-13" stroke-width="2.8"/>
      <path d="M -8,-7 A 11,11 0 0 1 8,-7" stroke-width="2.3"/>
      <path d="M -4,-2 A 5.5,5.5 0 0 1 4,-2" stroke-width="2"/>
      <circle cx="0" cy="4" r="2.5" fill="#6080A0"/>
    </g>
    <!-- Card number dots -->
    <g fill="#7090B0" opacity="0.42">
      <circle cx="-136" cy="42" r="3.5"/><circle cx="-124" cy="42" r="3.5"/><circle cx="-112" cy="42" r="3.5"/><circle cx="-100" cy="42" r="3.5"/>
      <circle cx="-70" cy="42" r="3.5"/><circle cx="-58" cy="42" r="3.5"/><circle cx="-46" cy="42" r="3.5"/><circle cx="-34" cy="42" r="3.5"/>
      <circle cx="-4" cy="42" r="3.5"/><circle cx="8" cy="42" r="3.5"/><circle cx="20" cy="42" r="3.5"/><circle cx="32" cy="42" r="3.5"/>
      <circle cx="62" cy="42" r="3.5"/><circle cx="74" cy="42" r="3.5"/><circle cx="86" cy="42" r="3.5"/><circle cx="98" cy="42" r="3.5"/>
    </g>
    <!-- Name & expiry bars -->
    <rect x="-136" y="68" width="110" height="9" rx="4.5" fill="#8090A8" opacity="0.30"/>
    <rect x="-136" y="84" width="56" height="7" rx="3.5" fill="#8090A8" opacity="0.22"/>
    <!-- Card network -->
    <circle cx="126" cy="84" r="15" fill="#C03838" opacity="0.50"/>
    <circle cx="148" cy="84" r="15" fill="#D07818" opacity="0.50"/>
  </g>

  <!-- FindCard (right) -->
  <g transform="translate(668, 450)" filter="url(#sh2)">
    <rect x="-190" y="-120" width="380" height="240" rx="20" fill="#1C1E22"/>
    <rect x="-190" y="-120" width="380" height="240" rx="20" fill="url(#pb)" opacity="0.92"/>
    <rect x="-190" y="-120" width="380" height="2" fill="white" opacity="0.05"/>
    <!-- Wireless symbol -->
    <g transform="translate(-105, 0)" fill="none" stroke="#282B2E" stroke-linecap="round">
      <path d="M -10,0 A 11,11 0 0 0 10,0" stroke-width="3.2"/>
      <path d="M -16,4 A 17,17 0 0 0 16,4" stroke-width="2.8"/>
      <path d="M -23,8 A 24,24 0 0 0 23,8" stroke-width="2.5"/>
      <path d="M 3,13 L -4,26 L 1,26 L -5,39" stroke-width="2.8"/>
    </g>
    <!-- Slot right edge -->
    <rect x="181" y="-38" width="9" height="18" rx="3" fill="#0F1114"/>
  </g>

  <!-- Same size indicator (no text, just equal sign and arrows) -->
  <line x1="450" y1="250" x2="450" y2="680" stroke="#C0C4CC" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.55"/>
  <!-- Double-headed arrow showing equal size -->
  <path d="M 220,590 L 200,590 L 210,582 M 200,590 L 210,598" stroke="#32AE60" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 680,590 L 700,590 L 690,582 M 700,590 L 690,598" stroke="#32AE60" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="200" y1="590" x2="700" y2="590" stroke="#32AE60" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.5"/>
</svg>
