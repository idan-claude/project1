<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="creditCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D0D8E8"/>
      <stop offset="100%" stop-color="#A8B4C8"/>
    </linearGradient>
    <linearGradient id="creditChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C840"/>
      <stop offset="100%" stop-color="#B89020"/>
    </linearGradient>
  </defs>

  <!-- Background: clean white-gray -->
  <rect width="900" height="900" fill="#F2F4F8"/>
  <ellipse cx="450" cy="430" rx="380" ry="240" fill="white" opacity="0.55"/>

  <!-- CENTER DIVIDER LINE -->
  <line x1="450" y1="200" x2="450" y2="720" stroke="#C0C4CC" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- LEFT: Standard credit card -->
  <g transform="translate(230, 440)">
    <!-- Card shadow -->
    <rect x="-195" y="-123" width="390" height="246" rx="20" fill="#000" opacity="0.08" transform="translate(4,8)"/>
    <!-- Credit card body (silver-blue, typical bank card feel) -->
    <rect x="-195" y="-123" width="390" height="246" rx="20" fill="url(#creditCardGrad)"/>
    <!-- Top subtle shine -->
    <rect x="-195" y="-123" width="390" height="50" rx="20" fill="white" opacity="0.25"/>
    <!-- Chip -->
    <rect x="-130" y="-60" width="52" height="42" rx="7" fill="url(#creditChip)"/>
    <line x1="-130" y1="-47" x2="-78" y2="-47" stroke="#7A5200" stroke-width="0.8" opacity="0.5"/>
    <line x1="-130" y1="-35" x2="-78" y2="-35" stroke="#7A5200" stroke-width="0.8" opacity="0.5"/>
    <line x1="-112" y1="-60" x2="-112" y2="-18" stroke="#7A5200" stroke-width="0.8" opacity="0.5"/>
    <line x1="-97" y1="-60" x2="-97" y2="-18" stroke="#7A5200" stroke-width="0.8" opacity="0.5"/>
    <!-- Contactless symbol -->
    <g transform="translate(120, -40)" fill="none" stroke="#6080A0" stroke-linecap="round" opacity="0.55">
      <path d="M-14,-14 A20,20 0 0,1 14,-14" stroke-width="3"/>
      <path d="M-9,-8 A13,13 0 0,1 9,-8" stroke-width="2.5"/>
      <path d="M-4,-2 A6,6 0 0,1 4,-2" stroke-width="2"/>
      <circle cx="0" cy="4" r="2.5" fill="#6080A0"/>
    </g>
    <!-- Card number row -->
    <g fill="#7090B0" opacity="0.50">
      <circle cx="-140" cy="40" r="3.5"/><circle cx="-128" cy="40" r="3.5"/><circle cx="-116" cy="40" r="3.5"/><circle cx="-104" cy="40" r="3.5"/>
      <circle cx="-72" cy="40" r="3.5"/><circle cx="-60" cy="40" r="3.5"/><circle cx="-48" cy="40" r="3.5"/><circle cx="-36" cy="40" r="3.5"/>
      <circle cx="-4" cy="40" r="3.5"/><circle cx="8" cy="40" r="3.5"/><circle cx="20" cy="40" r="3.5"/><circle cx="32" cy="40" r="3.5"/>
      <circle cx="64" cy="40" r="3.5"/><circle cx="76" cy="40" r="3.5"/><circle cx="88" cy="40" r="3.5"/><circle cx="100" cy="40" r="3.5"/>
    </g>
    <!-- Bank name area -->
    <rect x="-195" y="60" width="390" height="62" rx="0" fill="#B8C4D4" opacity="0.30"/>
    <!-- Name placeholder -->
    <rect x="-140" y="74" width="120" height="10" rx="5" fill="#8090A8" opacity="0.35"/>
    <!-- Expiry -->
    <rect x="-140" y="92" width="60" height="8" rx="4" fill="#8090A8" opacity="0.25"/>
    <!-- Visa/Mastercard placeholder -->
    <circle cx="130" cy="88" r="16" fill="#D04040" opacity="0.55"/>
    <circle cx="152" cy="88" r="16" fill="#E08020" opacity="0.55"/>
  </g>

  <!-- RIGHT: FindCard matte black card -->
  <g transform="translate(670, 440)">
    <!-- Card shadow -->
    <rect x="-195" y="-123" width="390" height="246" rx="20" fill="#000" opacity="0.12" transform="translate(4,8)"/>
    <!-- Matte black card body -->
    <rect x="-195" y="-123" width="390" height="246" rx="20" fill="#1A1A1C"/>

    <!-- Dense matte texture dots -->
    <g fill="#2C2C2E" opacity="0.55">
      <circle cx="-170" cy="-100" r="1.2"/><circle cx="-148" cy="-100" r="1.2"/><circle cx="-126" cy="-100" r="1.2"/><circle cx="-104" cy="-100" r="1.2"/><circle cx="-82" cy="-100" r="1.2"/><circle cx="-60" cy="-100" r="1.2"/><circle cx="-38" cy="-100" r="1.2"/><circle cx="-16" cy="-100" r="1.2"/><circle cx="6" cy="-100" r="1.2"/><circle cx="28" cy="-100" r="1.2"/><circle cx="50" cy="-100" r="1.2"/><circle cx="72" cy="-100" r="1.2"/><circle cx="94" cy="-100" r="1.2"/><circle cx="116" cy="-100" r="1.2"/><circle cx="138" cy="-100" r="1.2"/><circle cx="160" cy="-100" r="1.2"/>
      <circle cx="-181" cy="-78" r="1.2"/><circle cx="-159" cy="-78" r="1.2"/><circle cx="-137" cy="-78" r="1.2"/><circle cx="-115" cy="-78" r="1.2"/><circle cx="-93" cy="-78" r="1.2"/><circle cx="-71" cy="-78" r="1.2"/><circle cx="-49" cy="-78" r="1.2"/><circle cx="-27" cy="-78" r="1.2"/><circle cx="-5" cy="-78" r="1.2"/><circle cx="17" cy="-78" r="1.2"/><circle cx="39" cy="-78" r="1.2"/><circle cx="61" cy="-78" r="1.2"/><circle cx="83" cy="-78" r="1.2"/><circle cx="105" cy="-78" r="1.2"/><circle cx="127" cy="-78" r="1.2"/><circle cx="149" cy="-78" r="1.2"/><circle cx="171" cy="-78" r="1.2"/>
      <circle cx="-170" cy="-56" r="1.2"/><circle cx="-148" cy="-56" r="1.2"/><circle cx="-126" cy="-56" r="1.2"/><circle cx="-104" cy="-56" r="1.2"/><circle cx="-82" cy="-56" r="1.2"/><circle cx="-60" cy="-56" r="1.2"/><circle cx="-38" cy="-56" r="1.2"/><circle cx="-16" cy="-56" r="1.2"/><circle cx="6" cy="-56" r="1.2"/><circle cx="28" cy="-56" r="1.2"/><circle cx="50" cy="-56" r="1.2"/><circle cx="72" cy="-56" r="1.2"/><circle cx="94" cy="-56" r="1.2"/><circle cx="116" cy="-56" r="1.2"/><circle cx="138" cy="-56" r="1.2"/><circle cx="160" cy="-56" r="1.2"/>
      <circle cx="-181" cy="-34" r="1.2"/><circle cx="-159" cy="-34" r="1.2"/><circle cx="-137" cy="-34" r="1.2"/><circle cx="-115" cy="-34" r="1.2"/><circle cx="-93" cy="-34" r="1.2"/><circle cx="-71" cy="-34" r="1.2"/><circle cx="-49" cy="-34" r="1.2"/><circle cx="-27" cy="-34" r="1.2"/><circle cx="-5" cy="-34" r="1.2"/><circle cx="17" cy="-34" r="1.2"/><circle cx="39" cy="-34" r="1.2"/><circle cx="61" cy="-34" r="1.2"/><circle cx="83" cy="-34" r="1.2"/><circle cx="105" cy="-34" r="1.2"/><circle cx="127" cy="-34" r="1.2"/><circle cx="171" cy="-34" r="1.2"/>
    </g>

    <!-- Top edge highlight (very subtle) -->
    <rect x="-195" y="-123" width="390" height="2" rx="1" fill="white" opacity="0.06"/>

    <!-- Wireless coil (replaces chip) -->
    <g transform="translate(-120, -45)" fill="none" stroke="white" opacity="0.30">
      <circle cx="0" cy="0" r="22" stroke-width="2"/>
      <circle cx="0" cy="0" r="14" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2.5" fill="white" stroke="none"/>
    </g>

    <!-- FindCard PRO wordmark -->
    <text x="-175" y="105" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="white" opacity="0.22" letter-spacing="2">FINDCARD PRO</text>
  </g>

  <!-- LABELS under each card -->
  <text x="230" y="600" font-family="Arial, sans-serif" font-size="14" fill="#6080A0" text-anchor="middle" font-weight="600" opacity="0.7">כרטיס אשראי רגיל</text>
  <text x="670" y="600" font-family="Arial, sans-serif" font-size="14" fill="#3A3A4A" text-anchor="middle" font-weight="700">FindCard PRO</text>

  <!-- SIZE = badges -->
  <rect x="150" y="625" width="160" height="28" rx="14" fill="#E0E8F0"/>
  <text x="230" y="643" font-family="Arial, sans-serif" font-size="12" fill="#6080A0" text-anchor="middle">85.6 × 54 × 1.8 מ״מ</text>

  <rect x="590" y="625" width="160" height="28" rx="14" fill="#E0E4F8"/>
  <text x="670" y="643" font-family="Arial, sans-serif" font-size="12" fill="#3A3A6A" text-anchor="middle" font-weight="600">85.6 × 54 × 1.8 מ״מ</text>

  <!-- Equals sign -->
  <text x="450" y="648" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#32AE60" text-anchor="middle">=</text>

  <!-- "Identical size" label -->
  <rect x="330" y="672" width="240" height="36" rx="18" fill="#E8F5EC" stroke="#32AE60" stroke-width="1.5"/>
  <text x="450" y="695" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1A5A2A" text-anchor="middle">גודל זהה בדיוק ✓</text>

  <!-- Caption -->
  <text x="450" y="796" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1A2E" text-anchor="middle" opacity="0.88">אותו גודל כמו כרטיס בארנק שלך</text>
  <text x="450" y="820" font-family="Arial, sans-serif" font-size="13" fill="#888" text-anchor="middle">נכנס לכל תא כרטיסים · ללא בליטה · ללא תוספת עובי</text>
</svg>
