<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <!-- Background: warm neutral -->
  <rect width="900" height="900" fill="#F0EDE8"/>
  <ellipse cx="450" cy="400" rx="320" ry="200" fill="white" opacity="0.4"/>

  <!-- Two fingers holding card from bottom -->
  <!-- Thumb (left side) -->
  <g opacity="0.95">
    <!-- Thumb body -->
    <ellipse cx="240" cy="720" rx="55" ry="180" fill="#E8C4A0"/>
    <ellipse cx="240" cy="720" rx="55" ry="180" fill="none" stroke="#D4A882" stroke-width="1.5" opacity="0.4"/>
    <!-- Thumb tip rounded -->
    <ellipse cx="240" cy="540" rx="55" ry="38" fill="#E8C4A0"/>
    <!-- Thumb nail -->
    <ellipse cx="240" cy="525" rx="22" ry="14" fill="#F0D5BE" stroke="#D4A882" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Index finger (right side) -->
  <g opacity="0.95">
    <!-- Finger body -->
    <ellipse cx="660" cy="730" rx="42" ry="175" fill="#DFBA96"/>
    <ellipse cx="660" cy="730" rx="42" ry="175" fill="none" stroke="#C9A07E" stroke-width="1.5" opacity="0.4"/>
    <!-- Finger tip -->
    <ellipse cx="660" cy="555" rx="42" ry="32" fill="#DFBA96"/>
    <!-- Finger nail -->
    <ellipse cx="660" cy="540" rx="18" ry="12" fill="#EDD0B8" stroke="#C9A07E" stroke-width="1" opacity="0.6"/>
    <!-- Knuckle line -->
    <path d="M620,640 Q660,635 700,640" stroke="#C9A07E" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M622,680 Q660,675 698,680" stroke="#C9A07E" stroke-width="1" fill="none" opacity="0.2"/>
  </g>

  <!-- Card held between fingers (landscape, centered) -->
  <g transform="translate(450 470)">
    <!-- Card shadow -->
    <rect x="-240" y="-80" width="480" height="160" rx="14" fill="#000" opacity="0.12" transform="translate(4,8)"/>
    <!-- Matte black card body -->
    <rect x="-240" y="-80" width="480" height="160" rx="14" fill="#1A1A1C"/>

    <!-- Matte texture dots (subtle) -->
    <g fill="#2C2C2E" opacity="0.45">
      <circle cx="-210" cy="-55" r="1"/><circle cx="-185" cy="-55" r="1"/><circle cx="-160" cy="-55" r="1"/><circle cx="-135" cy="-55" r="1"/><circle cx="-110" cy="-55" r="1"/><circle cx="-85" cy="-55" r="1"/><circle cx="-60" cy="-55" r="1"/><circle cx="-35" cy="-55" r="1"/><circle cx="-10" cy="-55" r="1"/><circle cx="15" cy="-55" r="1"/><circle cx="40" cy="-55" r="1"/><circle cx="65" cy="-55" r="1"/><circle cx="90" cy="-55" r="1"/><circle cx="115" cy="-55" r="1"/><circle cx="140" cy="-55" r="1"/><circle cx="165" cy="-55" r="1"/><circle cx="190" cy="-55" r="1"/><circle cx="215" cy="-55" r="1"/>
      <circle cx="-222" cy="-35" r="1"/><circle cx="-197" cy="-35" r="1"/><circle cx="-172" cy="-35" r="1"/><circle cx="-147" cy="-35" r="1"/><circle cx="-122" cy="-35" r="1"/><circle cx="-97" cy="-35" r="1"/><circle cx="-72" cy="-35" r="1"/><circle cx="-47" cy="-35" r="1"/><circle cx="-22" cy="-35" r="1"/><circle cx="3" cy="-35" r="1"/><circle cx="28" cy="-35" r="1"/><circle cx="53" cy="-35" r="1"/><circle cx="78" cy="-35" r="1"/><circle cx="103" cy="-35" r="1"/><circle cx="128" cy="-35" r="1"/><circle cx="153" cy="-35" r="1"/><circle cx="178" cy="-35" r="1"/><circle cx="203" cy="-35" r="1"/>
    </g>

    <!-- Top edge subtle highlight -->
    <rect x="-240" y="-80" width="480" height="2" rx="1" fill="white" opacity="0.06"/>

    <!-- Wireless coil (bottom right) -->
    <g transform="translate(185, 45)" fill="none" stroke="white" stroke-linecap="round" opacity="0.25">
      <circle cx="0" cy="0" r="18" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="11" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="5" stroke-width="1.2"/>
    </g>

    <!-- "FindCard PRO" mark -->
    <text x="-210" y="60" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="white" opacity="0.20" letter-spacing="1.5">FINDCARD PRO</text>
  </g>

  <!-- Caption -->
  <text x="450" y="800" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#2A1F10" text-anchor="middle" opacity="0.85">אותו גודל ועובי כמו כרטיס אשראי</text>
  <text x="450" y="824" font-family="Arial, sans-serif" font-size="13" fill="#888" text-anchor="middle">1.8 מ״מ עובי · נכנס לכל ארנק</text>
</svg>
