<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" shape-rendering="geometricPrecision">
  <defs>
    <pattern id="pb" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#1C1E22"/>
      <circle cx="2" cy="2" r="1.5" fill="#252829"/>
      <circle cx="6.5" cy="6.5" r="1.5" fill="#252829"/>
      <circle cx="2" cy="7" r="1.1" fill="#232628"/>
      <circle cx="7" cy="2" r="1.1" fill="#232628"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.20"/>
    </filter>
    <linearGradient id="sk1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C498"/>
      <stop offset="100%" stop-color="#E0AE80"/>
    </linearGradient>
    <linearGradient id="sk2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B884"/>
      <stop offset="100%" stop-color="#D49A68"/>
    </linearGradient>
  </defs>

  <rect width="900" height="900" fill="#F2F0EC"/>

  <!-- Palm base -->
  <ellipse cx="174" cy="562" rx="128" ry="192" fill="url(#sk2)"/>

  <!-- Thumb behind card -->
  <g transform="translate(276, 558) rotate(-22)">
    <rect x="-26" y="-95" width="52" height="140" rx="26" fill="url(#sk2)"/>
  </g>

  <!-- Index finger behind card -->
  <g transform="translate(266, 350) rotate(14)">
    <rect x="-21" y="-82" width="42" height="126" rx="21" fill="url(#sk2)"/>
  </g>

  <!-- Card in front of back fingers -->
  <g transform="translate(510, 452) rotate(3)" filter="url(#sh)">
    <rect x="-200" y="-126" width="400" height="252" rx="18" fill="#1C1E22"/>
    <rect x="-200" y="-126" width="400" height="252" rx="18" fill="url(#pb)" opacity="0.92"/>
    <rect x="-200" y="-126" width="400" height="2" fill="white" opacity="0.05"/>
    <g transform="translate(-56, 15)" fill="none" stroke="#282B2E" stroke-linecap="round">
      <path d="M -11,0 A 12,12 0 0 0 11,0" stroke-width="3.4"/>
      <path d="M -17,4 A 18,18 0 0 0 17,4" stroke-width="3"/>
      <path d="M -25,8 A 26,26 0 0 0 25,8" stroke-width="2.6"/>
      <path d="M 4,13 L -4,28 L 1,28 L -6,43" stroke-width="3"/>
    </g>
    <rect x="190" y="-56" width="10" height="20" rx="3" fill="#0F1114"/>
  </g>

  <!-- Index finger tip in front of card -->
  <g transform="translate(296, 342) rotate(13)">
    <rect x="-19" y="-70" width="38" height="110" rx="19" fill="url(#sk1)"/>
    <ellipse cx="0" cy="-60" rx="17" ry="11" fill="#F4C8A0" opacity="0.5"/>
  </g>

  <!-- Thumb tip in front of card -->
  <g transform="translate(302, 565) rotate(-21)">
    <rect x="-24" y="-82" width="48" height="118" rx="24" fill="url(#sk1)"/>
    <ellipse cx="0" cy="-70" rx="21" ry="13" fill="#F4C8A0" opacity="0.45"/>
  </g>
</svg>
