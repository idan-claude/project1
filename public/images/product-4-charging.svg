<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" shape-rendering="geometricPrecision">
  <defs>
    <pattern id="pb" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#1C1E22"/>
      <circle cx="2" cy="2" r="1.5" fill="#252829"/>
      <circle cx="6.5" cy="6.5" r="1.5" fill="#252829"/>
      <circle cx="2" cy="7" r="1.1" fill="#232628"/>
      <circle cx="7" cy="2" r="1.1" fill="#232628"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2255CC" stop-opacity="0.42"/>
      <stop offset="70%" stop-color="#112299" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0A1150" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="padSurf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A2A32"/>
      <stop offset="100%" stop-color="#181820"/>
    </radialGradient>
  </defs>

  <rect width="900" height="900" fill="#080C18"/>
  <ellipse cx="450" cy="620" rx="340" ry="190" fill="url(#glow)"/>

  <!-- Charging rings -->
  <circle cx="450" cy="615" r="262" fill="none" stroke="#2244BB" stroke-width="1" opacity="0.06"/>
  <circle cx="450" cy="615" r="218" fill="none" stroke="#2244BB" stroke-width="1" opacity="0.09"/>
  <circle cx="450" cy="615" r="175" fill="none" stroke="#3355CC" stroke-width="1.5" opacity="0.14"/>
  <circle cx="450" cy="615" r="134" fill="none" stroke="#4466DD" stroke-width="2" opacity="0.20"/>
  <circle cx="450" cy="615" r="98" fill="none" stroke="#5577EE" stroke-width="2" opacity="0.28"/>

  <!-- Pad body -->
  <ellipse cx="450" cy="642" rx="166" ry="28" fill="#111118"/>
  <ellipse cx="450" cy="636" rx="163" ry="22" fill="url(#padSurf)"/>
  <ellipse cx="450" cy="635" rx="106" ry="13" fill="none" stroke="#383844" stroke-width="1" opacity="0.5"/>
  <!-- LED -->
  <circle cx="380" cy="635" r="4" fill="#4488FF" opacity="0.88"/>
  <circle cx="380" cy="635" r="8" fill="#4488FF" opacity="0.22"/>

  <!-- FindCard on pad -->
  <g transform="translate(450, 538)">
    <rect x="-155" y="-98" width="310" height="196" rx="16" fill="#000" opacity="0.32" transform="translate(3,12)"/>
    <rect x="-155" y="-98" width="310" height="196" rx="16" fill="#1C1E22"/>
    <rect x="-155" y="-98" width="310" height="196" rx="16" fill="url(#pb)" opacity="0.92"/>
    <rect x="-155" y="-98" width="310" height="2" fill="white" opacity="0.05"/>
    <!-- Wireless symbol subtly lit during charging -->
    <g transform="translate(-43, 12)" fill="none" stroke="#3366CC" stroke-linecap="round" opacity="0.55">
      <path d="M -9,0 A 10,10 0 0 0 9,0" stroke-width="2.6"/>
      <path d="M -14,4 A 15,15 0 0 0 14,4" stroke-width="2.3"/>
      <path d="M -20,8 A 21,21 0 0 0 20,8" stroke-width="2"/>
      <path d="M 3,13 L -4,25 L 1,25 L -5,38" stroke-width="2.3"/>
    </g>
    <rect x="147" y="-43" width="9" height="18" rx="3" fill="#0F1114"/>
  </g>
</svg>
