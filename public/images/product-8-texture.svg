<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" shape-rendering="geometricPrecision">
  <defs>
    <!-- Larger pattern for macro close-up visibility -->
    <pattern id="pb" x="0" y="0" width="11" height="11" patternUnits="userSpaceOnUse">
      <rect width="11" height="11" fill="#1C1E22"/>
      <circle cx="2.5" cy="2.5" r="2" fill="#262A2E"/>
      <circle cx="8" cy="8" r="2" fill="#262A2E"/>
      <circle cx="2.5" cy="8.5" r="1.5" fill="#242628"/>
      <circle cx="8.5" cy="2.5" r="1.5" fill="#242628"/>
    </pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="22" stdDeviation="38" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Very dark background matching card color -->
  <rect width="900" height="900" fill="#14161A"/>

  <!-- Card fills most of frame (macro perspective) -->
  <g transform="translate(450, 450)" filter="url(#sh)">
    <rect x="-340" y="-214" width="680" height="428" rx="32" fill="#1C1E22"/>
    <rect x="-340" y="-214" width="680" height="428" rx="32" fill="url(#pb)" opacity="0.95"/>
    <!-- Top edge highlight -->
    <rect x="-340" y="-214" width="680" height="2.5" fill="white" opacity="0.05"/>
    <!-- Left edge highlight -->
    <rect x="-340" y="-214" width="2.5" height="428" fill="white" opacity="0.03"/>
    <!-- Large wireless symbol prominent in close-up -->
    <g transform="translate(-95, 26)" fill="none" stroke="#2A2D30" stroke-linecap="round">
      <path d="M -19,0 A 20,20 0 0 0 19,0" stroke-width="5.8"/>
      <path d="M -29,7 A 30,30 0 0 0 29,7" stroke-width="5.2"/>
      <path d="M -42,14 A 43,43 0 0 0 42,14" stroke-width="4.6"/>
      <path d="M 6,23 L -8,46 L 3,46 L -12,72" stroke-width="5.2"/>
    </g>
    <!-- Slot on right edge (visible in close-up) -->
    <rect x="330" y="-96" width="14" height="28" rx="4.5" fill="#0F1114"/>
  </g>
</svg>
